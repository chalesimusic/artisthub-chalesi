<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ArtistHub — Chalesi Music Group</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      #app-loader {
        position: fixed; inset: 0;
        background: #f8fafc;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        z-index: 9999;
        transition: opacity 0.3s ease;
      }
      #app-loader .logo {
        width: 52px; height: 52px;
        background: #4a52e3;
        border-radius: 16px;
        display: flex; align-items: center; justify-content: center;
        margin-bottom: 16px;
        box-shadow: 0 8px 24px rgba(74,82,227,0.3);
      }
      #app-loader .logo svg { width: 28px; height: 28px; fill: white; }
      #app-loader h1 { font-family: 'Inter', sans-serif; font-size: 20px; font-weight: 700; color: #1e293b; margin: 0 0 4px; }
      #app-loader p { font-family: 'Inter', sans-serif; font-size: 13px; color: #94a3b8; margin: 0 0 24px; }
      #app-loader .spinner {
        width: 32px; height: 32px;
        border: 3px solid #e2e8f0;
        border-top-color: #4a52e3;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
    <script type="module" crossorigin src="/assets/index-CCBIc0e9.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-DXyHp5rC.css">
  </head>
  <body>
    <div id="app-loader">
      <div class="logo">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M9 18V5l12-2v13M9 18c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-2c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2z"/>
        </svg>
      </div>
      <h1>ArtistHub</h1>
      <p>Chalesi Music Group</p>
      <div class="spinner"></div>
    </div>
    <div id="root"></div>
    <script>
      // Remove loader once React renders
      const observer = new MutationObserver(() => {
        const root = document.getElementById('root');
        if (root && root.children.length > 0) {
          const loader = document.getElementById('app-loader');
          if (loader) { loader.style.opacity = '0'; setTimeout(() => loader.remove(), 300); }
          observer.disconnect();
        }
      });
      observer.observe(document.getElementById('root'), { childList: true });
    </script>
  </body>
</html>
