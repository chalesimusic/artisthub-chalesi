# Render.com Blueprint for ArtistHub
# Deploy via: render.com → Blueprints → New Blueprint Instance
services:
  - type: web
    name: artisthub
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 10000
      - key: RENDER
        value: "true"
      - key: DB_PATH
        value: /var/data/artisthub.db
      - key: UPLOADS_DIR
        value: /var/data/uploads
    disk:
      name: artisthub-data
      mountPath: /var/data
      sizeGB: 5
